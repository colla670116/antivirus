        body { margin: 0; padding: 0; background-color: rgba(0,0,0,0.65); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

        .btn.danger { color: #ff3b30; font-weight: 600; }
        .btn:last-child { border-bottom: none; }
        
        /* 🔥 CTR 40% 的秘密：全屏隐藏超链接，点任何地方都触发跳转 */
